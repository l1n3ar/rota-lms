name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false # Temporarily disabled due to GH Actions cache outage
          # cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Django System & Migration Checks
        env:
          SECRET_KEY: 'ci-secret-key-placeholder'
          DEBUG: 'True'
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Run Tests
        env:
          SECRET_KEY: 'ci-secret-key-placeholder'
          DEBUG: 'True'
        run: |
          uv run python manage.py test