          maxLength: 110
        issue_description:
          type: string
          maxLength: 1000
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        assignee:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          readOnly: true
      required:
      - assignee
      - category
      - comments
      - created_at
      - created_by
      - id
      - issue_description
      - subject
      - updated_at
    TicketList:
      type: object
      description: |-
        List tickets for the authenticated user.
        Includes last comment date.
      properties:
        id:
          type: string
          readOnly: true
        category:
          type: string
          maxLength: 50
        subject:
          type: string
          maxLength: 110
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        last_comment_date:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - id
      - last_comment_date
      - subject
      - updated_at
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserProfileResponse:
      type: object
      description: Formats the response, including a freshly minted token pair.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        profile_complete:
          type: boolean
          readOnly: true
        refresh:
          type: string
          readOnly: true
        access:
          type: string
          readOnly: true
      required:
      - access
      - email
      - id
      - profile_complete
      - refresh
    UserProfileUpdate:
      type: object
      description: |-
        Validates first and last name updates.
        Both fields are required for the profile to be considered complete.
      properties:
        first_name:
          type: string
          maxLength: 150
          minLength: 2
        last_name:
          type: string
          maxLength: 150
          minLength: 2
      required:
      - first_name
      - last_name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
