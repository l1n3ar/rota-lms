openapi: 3.0.3
info:
  title: ROTA OPENCORE API
  version: 0.1.0
  description: 'The first version of the ROTA OPENCORE API. Note: This is currently
    in development and is not intended for production use.'
paths:
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: |-
        Allows a user to retrieve or update their profile.
        This is the only authenticated endpoint accessible without a complete profile.
      summary: Get Current User Profile
      tags:
      - Auth
      - Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
    put:
      operationId: v1_auth_me_update
      description: Replace user profile data. Returns a fresh JWT pair with updated
        claims.
      summary: Update Profile Full
      tags:
      - Auth
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      description: Submit first_name and last_name to complete onboarding. Returns
        a fresh JWT pair with updated claims.
      summary: Update Profile Partial (Complete Onboarding)
      tags:
      - Auth
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: v1_auth_otp_request_create
      description: Sends a short-lived 6-digit OTP code to the provided email address
        via background worker. If `settings.DEBUG` is enabled, the code is also returned
        in the response body as `_debug_otp`.
      summary: Request a 6-digit OTP code
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestResponse'
              examples:
                ProductionResponse:
                  value:
                    detail: OTP sent successfully.
                  summary: Production Response
                DebugResponse(DEBUG=True):
                  value:
                    detail: OTP sent successfully.
                    _debug_otp: '482910'
                  summary: Debug Response (DEBUG=True)
          description: OTP successfully generated and queued for delivery.
        '400':
          description: Invalid email format.
        '429':
          description: Rate limit exceeded (Max 5 requests/min).
  /api/v1/auth/otp/verify/:
    post:
      operationId: v1_auth_otp_verify_create
      description: 'Validates the 6-digit OTP code for a given email. On success,
        burns the OTP and issues a SimpleJWT access/refresh token pair. Also returns
        `profile_complete: false` if the user must finish onboarding.'
      summary: Verify OTP and exchange for JWT tokens
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerify'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerifyResponse'
              examples:
                ReturningUser(ProfileComplete):
                  value:
                    refresh: eyJhbGciOiJIUzI1NiIsIn...
                    access: eyJhbGciOiJIUzI1NiIsIn...
                    profile_complete: true
                  summary: Returning User (Profile Complete)
                NewUser(NeedsOnboarding):
                  value:
                    refresh: eyJhbGciOiJIUzI1NiIsIn...
                    access: eyJhbGciOiJIUzI1NiIsIn...
                    profile_complete: false
                  summary: New User (Needs Onboarding)
          description: Authentication successful. Returns JWT pair and profile status.
        '400':
          description: Invalid, used, or expired OTP code.
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: Takes a refresh type JSON web token and returns a new access type
        JSON web token.
      summary: Refresh JWT Token
      tags:
      - Auth
      - Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/ticket/:
    get:
      operationId: v1_ticket_list
      description: Returns all tickets. Superusers see all tickets in the system.
        Regular users only see tickets they created.
      summary: List user tickets
      tags:
      - Ticket
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketList'
          description: ''
  /api/v1/ticket/{ticket_id}/:
    get:
      operationId: v1_ticket_retrieve
      description: Retrieve a ticket by ticket_id. Superusers can access and update
        ANY ticket. Regular users can only access their own.
      summary: Retrieve or update ticket details
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: string
        required: true
      tags:
      - Ticket
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: ''
    put:
      operationId: v1_ticket_update
      description: Retrieve a ticket by ticket_id. Superusers can access and update
        ANY ticket. Regular users can only access their own.
      summary: Retrieve or update ticket details
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: string
        required: true
      tags:
      - Ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: ''
    patch:
      operationId: v1_ticket_partial_update
      description: Retrieve a ticket by ticket_id. Superusers can access and update
        ANY ticket. Regular users can only access their own.
      summary: Retrieve or update ticket details
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: string
        required: true
      tags:
      - Ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTicketDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTicketDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTicketDetail'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: ''
  /api/v1/ticket/{ticket_id}/comment/:
    post:
      operationId: v1_ticket_comment_create
      description: Authenticated users can add a comment to their own ticket by providing
        text and optional attachment.
      summary: Add a comment to a ticket
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: string
        required: true
      tags:
      - Ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/v1/ticket/create/:
    post:
      operationId: v1_ticket_create_create
      description: Authenticated users can create a ticket by providing title and
        issue_description. The ticket_id is generated automatically.
      summary: Create a new ticket
      tags:
      - Ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: ''
components:
  schemas:
    Comment:
      type: object
      description: Serializer for comments.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          readOnly: true
        text:
          type: string
          maxLength: 1000
        created_date:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        attachment:
          type: string
          format: uri
          nullable: true
      required:
      - created_date
      - id
      - text
      - user
    OTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    OTPRequestResponse:
      type: object
      properties:
        detail:
          type: string
          default: OTP sent successfully.
        _debug_otp:
          type: string
          title: ' debug otp'
          description: Only present when settings.DEBUG is True
    OTPVerify:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
      - email
    OTPVerifyResponse:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
        profile_complete:
          type: boolean
          description: If false, frontend must route user to profile onboarding.
      required:
      - access
      - profile_complete
      - refresh
    PatchedTicketDetail:
      type: object
      description: Detailed view of a ticket with all comments.
      properties:
        ticket_id:
          type: string
          maxLength: 8
        title:
          type: string
          maxLength: 110
        issue_description:
          type: string
          maxLength: 1000
        created_date:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          readOnly: true
    PatchedUserProfileUpdate:
      type: object
      description: |-
        Validates first and last name updates.
        Both fields are required for the profile to be considered complete.
      properties:
        first_name:
          type: string
          maxLength: 150
          minLength: 2
        last_name:
          type: string
          maxLength: 150
          minLength: 2
    TicketCreate:
      type: object
      description: |-
        Used for creating tickets (only title + issue_description).
        The user is set from JWT automatically.
      properties:
        title:
          type: string
          maxLength: 110
        issue_description:
          type: string
          maxLength: 1000
      required:
      - issue_description
      - title
    TicketDetail:
      type: object
      description: Detailed view of a ticket with all comments.
      properties:
        ticket_id:
          type: string
          maxLength: 8
        title:
          type: string
          maxLength: 110
        issue_description:
          type: string
          maxLength: 1000
        created_date:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          readOnly: true
      required:
      - comments
      - created_date
      - issue_description
      - title
    TicketList:
      type: object
      description: |-
        List tickets for the authenticated user.
        Includes last comment date.
      properties:
        ticket_id:
          type: string
          maxLength: 8
        title:
          type: string
          maxLength: 110
        completed_status:
          type: boolean
        last_comment_date:
          type: string
          readOnly: true
      required:
      - last_comment_date
      - title
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserProfileResponse:
      type: object
      description: Formats the response, including the newly minted tokens.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        profile_complete:
          type: boolean
          readOnly: true
        refresh:
          type: string
          readOnly: true
        access:
          type: string
          readOnly: true
      required:
      - access
      - email
      - id
      - profile_complete
      - refresh
    UserProfileUpdate:
      type: object
      description: |-
        Validates first and last name updates.
        Both fields are required for the profile to be considered complete.
      properties:
        first_name:
          type: string
          maxLength: 150
          minLength: 2
        last_name:
          type: string
          maxLength: 150
          minLength: 2
      required:
      - first_name
      - last_name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
