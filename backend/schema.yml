components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 150
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        emoji:
          type: string
          nullable: true
          maxLength: 100
      required:
      - id
      - title
    Comment:
      type: object
      description: Serializer for comments.
      properties:
        id:
          type: integer
          readOnly: true
        created_by:
          type: string
          readOnly: true
        text:
          type: string
          maxLength: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        attachment:
          type: string
          format: uri
          nullable: true
      required:
      - created_at
      - created_by
      - id
      - text
    CourseHome:
      type: object
      properties:
        title:
          type: string
          nullable: true
          maxLength: 300
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        picture:
          type: string
          format: uri
        featured:
          type: boolean
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
    IssuedCertificate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        certificate:
          allOf:
          - $ref: '#/components/schemas/PublicCertificate'
          readOnly: true
        user_name:
          type: string
          readOnly: true
        score:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
        verification_code:
          type: string
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
        pdf_url:
          type: string
          readOnly: true
      required:
      - certificate
      - id
      - issued_at
      - pdf_url
      - user_name
      - verification_code
    OTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    OTPRequestResponse:
      type: object
      properties:
        detail:
          type: string
          default: OTP sent successfully.
        _debug_otp:
          type: string
          title: ' debug otp'
          description: Only present when settings.DEBUG is True
    OTPVerify:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
      - email
    OTPVerifyResponse:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
        profile_complete:
          type: boolean
          description: If false, frontend must route user to profile onboarding.
      required:
      - access
      - profile_complete
      - refresh
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
