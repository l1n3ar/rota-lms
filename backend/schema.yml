          description: ''
    delete:
      operationId: v1_certificate_certificates_destroy
      summary: Delete a certificate (Admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this certificate.
        required: true
      tags:
